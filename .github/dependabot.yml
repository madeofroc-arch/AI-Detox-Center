# Dependency updates.
#
# Alerts on the Security tab are a badge nobody reads. Pull requests get
# reviewed. This file turns the former into the latter — and keeps Dependabot
# out of the one part of the tree it cannot safely touch.
version: 2
updates:
  - package-ecosystem: npm
    # One lockfile at the root covers both workspaces.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
    ignore:
      # Everything the Expo SDK version-pins, at EVERY update level.
      #
      # These packages are not independently versioned dependencies; they are
      # one release train, and `npx expo install --fix` is how you ride it.
      # `npx expo install --check` — a CI step since 064a270 — is the authority
      # on what an SDK supports. This list only stops Dependabot opening PRs
      # that gate would reject anyway. If the two ever disagree, the gate wins.
      #
      # Three real failures taught this list its shape, all within an hour of
      # the file being added:
      #
      #   - react-native-gesture-handler 2.32 -> 3.2.1. A major, and
      #     apps/mobile/package.json pins `~2.32.0` because Expo 57 requires
      #     that line.
      #   - The react-native family, 0.86 -> 0.87. All MINOR, all semver-valid,
      #     and rejected by `expo install --check` — so "majors only" was never
      #     enough.
      #   - react 19.2.3 -> 19.2.8 ALONE, leaving react-dom at 19.2.3. React
      #     refuses to boot on a version mismatch; the app's test suite caught
      #     it. There is no update level at which splitting that pair is safe.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "metro"
      - dependency-name: "metro-*"
      # Also on Expo's list: `expo install --check` validates these two against
      # the SDK, and typescript@7 was rejected for exactly that reason.
      - dependency-name: "typescript"
      - dependency-name: "@types/react"
      - dependency-name: "eslint-config-expo"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
