name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Privacy invariant — no network calls in source
        shell: bash
        run: |
          if grep -rnE "fetch\(|XMLHttpRequest|axios" packages/core/src apps/mobile/src; then
            echo "::error::Network call found in source — violates local-first privacy architecture (docs/architecture/privacy.md)"
            exit 1
          fi
          echo "No network calls in source. Privacy invariant holds."
