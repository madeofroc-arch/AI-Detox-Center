name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The authority on which versions of React Native, Metro and the
      # react-native-* family this Expo SDK supports is Expo, not a range in
      # package.json. A dependency bump that satisfies semver and breaks that
      # contract passes lint, typecheck and tests — the first Dependabot run on
      # this repo opened exactly that PR. This is the check that catches it,
      # and it stays correct as the SDK moves without anyone maintaining a list.
      - name: Expo SDK compatibility
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Build
        run: npm run build

      - name: Generated skill artifacts match skill/method
        run: npm run build:skill -- --check

      - name: Privacy invariant — no network calls in source
        shell: bash
        run: |
          if grep -rnE "fetch\(|XMLHttpRequest|axios" packages/core/src apps/mobile/src; then
            echo "::error::Network call found in source — violates local-first privacy architecture (docs/architecture/privacy.md)"
            exit 1
          fi
          echo "No network calls in source. Privacy invariant holds."
